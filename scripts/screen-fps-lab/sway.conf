# A bare desktop for the frame rate lab: one 1536x864 headless output, no bar,
# no borders. Windows float at the size their client asks for, so an animation
# changes a part of the picture, as a video or a spinner does on a real desktop.
output HEADLESS-1 mode 1536x864 position 0 0
output * bg #102030 solid_color
default_border none
default_floating_border none
focus_follows_mouse no
for_window [shell=".*"] floating enable, move position 100 100
