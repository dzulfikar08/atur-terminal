[package]
name = "muxy-cli"
description = "Atur Terminal command-line and terminal client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "atur-term"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
muxy-core = { path = "../muxy-core" }
muxy-protocol = { path = "../muxy-protocol" }
muxy-client = { path = "../muxy-client" }
muxy-app-core = { path = "../muxy-app-core" }
serde_json.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "underline-color"] }
signal-hook = "0.4"

[dev-dependencies]
muxy-terminal = { path = "../muxy-terminal" }
atur-screen = { path = "../atur-screen" }
tempfile = "3"
