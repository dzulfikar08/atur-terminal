name: echo-floor-emulator

# An experiment, not a gate: the facade's local-echo-off latency measured by a Rust program that runs
# on an Android emulator (x86_64, API 34, as the app's proof run) against a standalone server on the
# runner (10.0.2.2). GitHub-hosted runners only.
on:
  push:
    branches: [exp/echo-floor]
  workflow_dispatch:

concurrency:
  group: echo-floor-emulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  LIBGHOSTTY_VT_SYS_OPTIMIZE: ReleaseFast

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          targets: x86_64-linux-android
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Point the build at the pinned Zig through the baseline-CPU wrapper
        run: |
          echo "ATUR_TERM_ZIG=$(command -v zig)" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/scripts/zig" >> "$GITHUB_PATH"
      - name: Build the server and the command-line client (release)
        run: cargo build --release --locked -p muxy-server -p muxy-cli
      - name: Build the bench program for the emulator (x86_64)
        run: |
          cargo install cargo-ndk --locked --version 4.1.2
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          CARGO_PROFILE_RELEASE_DEBUG=0 cargo ndk -t x86_64 build --locked --release -p atur-mobile --features echo-bench --bin echo-bench
          ls -la target/x86_64-linux-android/release/echo-bench
      - name: Start a standalone server and print a pairing link for the emulator's view of the host
        run: scripts/echo-floor-server.sh target/release 7600 10.0.2.2 "$RUNNER_TEMP/echo-server"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the bench on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: scripts/echo-floor-emulator.sh target/x86_64-linux-android/release/echo-bench ${{ runner.temp }}/echo-server/link tls,tls+type+paste,auto
      - name: Summary
        if: always()
        run: |
          {
            echo '### Facade echo with local echo off, a Rust program on an Android emulator'
            echo '```'
            grep -h '^bench' emulator-bench.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: echo-floor-emulator
          path: |
            emulator-bench.txt
            ${{ runner.temp }}/echo-server/server.log
