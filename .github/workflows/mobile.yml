name: mobile

# The phone core (crates/atur-mobile): checks and tests on Linux, then the Android libraries and the
# iOS XCFramework the Atur app links. GitHub-hosted runners only.
on:
  push:
    branches: [atur-terminal, feat/mobile-rn]
    paths:
      - "crates/atur-mobile/**"
      - "crates/muxy-client/**"
      - "crates/muxy-protocol/**"
      - "crates/muxy-core/**"
      - "scripts/build-mobile-sdk.sh"
      - ".github/workflows/mobile.yml"
      - "Cargo.lock"
  pull_request:
    paths:
      - "crates/atur-mobile/**"
      - "scripts/build-mobile-sdk.sh"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LIBGHOSTTY_VT_SYS_OPTIMIZE: ReleaseFast

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/atur-terminal' || github.ref == 'refs/heads/feat/mobile-rn' }}
      - name: Point the build at the pinned Zig through the baseline-CPU wrapper
        run: |
          echo "ATUR_TERM_ZIG=$(command -v zig)" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/scripts/zig" >> "$GITHUB_PATH"
      - run: cargo fmt -p atur-mobile -- --check
      - run: cargo clippy --locked -p atur-mobile --all-targets -- -D warnings
      - run: cargo test --locked -p atur-mobile
      - name: Measure attach and echo through the facade (loopback TLS)
        run: |
          cargo test --locked -p atur-mobile --test sdk bench_facade -- --ignored --nocapture 2>&1 | tee bench.txt
          { echo '### Facade attach and echo, loopback TLS'; echo '```'; grep '^bench' bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: facade-bench
          path: bench.txt

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/atur-terminal' || github.ref == 'refs/heads/feat/mobile-rn' }}
      - run: cargo install cargo-ndk --locked --version 4.1.2
      - name: Build the Android libraries and the Kotlin bindings
        env:
          PLATFORMS: android
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          scripts/build-mobile-sdk.sh "$RUNNER_TEMP/atur-mobile"
          mkdir -p out && cp -r "$RUNNER_TEMP/atur-mobile/android" out/
          find out -type f | sort
      - uses: actions/upload-artifact@v4
        with:
          name: atur-mobile-android
          path: out/android

  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/atur-terminal' || github.ref == 'refs/heads/feat/mobile-rn' }}
      - name: Build the XCFramework and the Swift bindings
        env:
          PLATFORMS: ios
        run: |
          scripts/build-mobile-sdk.sh "$RUNNER_TEMP/atur-mobile"
          mkdir -p out && cp -r "$RUNNER_TEMP/atur-mobile/AturMobile.xcframework" "$RUNNER_TEMP/atur-mobile/swift" out/
          find out -maxdepth 3 | sort
      - uses: actions/upload-artifact@v4
        with:
          name: atur-mobile-ios
          path: out
