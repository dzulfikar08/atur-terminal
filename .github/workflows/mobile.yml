name: mobile

# The phone core (crates/atur-mobile): checks and tests on Linux, the same facade over a lossy link
# (TLS against UDP), the route race with one address delayed, then the Android libraries and the
# iOS XCFramework the Atur app links.
# GitHub-hosted runners only.
on:
  push:
    branches: [atur-terminal, feat/mobile-rn]
    paths:
      - "crates/atur-mobile/**"
      - "crates/muxy-client/**"
      - "crates/muxy-protocol/**"
      - "crates/muxy-core/**"
      - "crates/muxy-server/**"
      - "scripts/build-mobile-sdk.sh"
      - "scripts/lossy-netem.sh"
      - "scripts/route-netem.sh"
      - ".github/workflows/mobile.yml"
      - "Cargo.lock"
  pull_request:
    paths:
      - "crates/atur-mobile/**"
      - "crates/muxy-client/**"
      - "crates/muxy-server/**"
      - "crates/muxy-protocol/**"
      - "scripts/build-mobile-sdk.sh"
      - "scripts/lossy-netem.sh"
      - "scripts/route-netem.sh"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LIBGHOSTTY_VT_SYS_OPTIMIZE: ReleaseFast

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/atur-terminal' || github.ref == 'refs/heads/feat/mobile-rn' }}
      - name: Point the build at the pinned Zig through the baseline-CPU wrapper
        run: |
          echo "ATUR_TERM_ZIG=$(command -v zig)" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/scripts/zig" >> "$GITHUB_PATH"
      - run: cargo fmt -p atur-mobile -p muxy-protocol -p muxy-server -p muxy-client -- --check
      - run: cargo clippy --locked -p atur-mobile -p muxy-protocol -p muxy-server -p muxy-client --all-targets -- -D warnings
      - run: cargo test --locked -p atur-mobile -p muxy-protocol -p muxy-server -p muxy-client
      - name: Protocol fixtures stay append-only
        run: |
          git fetch --no-tags origin atur-terminal
          python3 scripts/protocol_fixtures.py append-only --base "$(git merge-base HEAD origin/atur-terminal)"
      - name: Measure attach and echo through the facade (loopback TLS)
        run: |
          cargo test --locked -p atur-mobile --test sdk bench_facade -- --ignored --nocapture 2>&1 | tee bench.txt
          { echo '### Facade attach and echo, loopback TLS'; echo '```'; grep '^bench' bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: facade-bench
          path: bench.txt

  lossy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config iproute2 iptables
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/atur-terminal' || github.ref == 'refs/heads/feat/mobile-rn' }}
      - name: Point the build at the pinned Zig through the baseline-CPU wrapper
        run: |
          echo "ATUR_TERM_ZIG=$(command -v zig)" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/scripts/zig" >> "$GITHUB_PATH"
      - name: Build the facade tests before the network is shaped
        run: cargo test --locked -p atur-mobile --test sdk --no-run
      - name: Check that the runner can shape loopback traffic
        run: |
          sudo modprobe sch_netem || true
          sudo modprobe sch_prio || true
          sudo modprobe cls_u32 || true
          if ! sudo tc qdisc add dev lo root netem delay 1ms; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
            sudo modprobe sch_netem sch_prio cls_u32
            sudo tc qdisc add dev lo root netem delay 1ms
          fi
          sudo tc qdisc del dev lo root
      - name: Echo and outage recovery on a link with 800 ms round trip and 10% loss, TLS then UDP
        env:
          # The bench asks scripts/lossy-netem.sh to shape exactly these two ports, once connected.
          ATUR_BENCH_NETEM: ${{ github.workspace }}/scripts/lossy-netem.sh
          ATUR_BENCH_TLS_PORT: "60200"
          ATUR_TERM_UDP_PORTS: "60100"
        run: |
          set -euo pipefail
          for transport in tls udp; do
            ATUR_BENCH_TRANSPORT="$transport" cargo test --locked -p atur-mobile --test sdk \
              bench_facade_lossy -- --ignored --nocapture 2>&1 | tee "lossy-$transport.txt"
          done
          {
            echo '### Facade on a shaped loopback link: 400 ms one way, 200 ms jitter, 5% loss each way, 10 s outage'
            echo '```'
            grep -h '^lossy' lossy-tls.txt lossy-udp.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the shaping
        if: always()
        env:
          ATUR_BENCH_TLS_PORT: "60200"
          ATUR_TERM_UDP_PORTS: "60100"
        run: |
          scripts/lossy-netem.sh outage-off || true
          scripts/lossy-netem.sh off || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: facade-lossy
          path: lossy-*.txt

  route:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config iproute2
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/atur-terminal' || github.ref == 'refs/heads/feat/mobile-rn' }}
      - name: Point the build at the pinned Zig through the baseline-CPU wrapper
        run: |
          echo "ATUR_TERM_ZIG=$(command -v zig)" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/scripts/zig" >> "$GITHUB_PATH"
      - name: Build the route tests before the network is shaped
        run: cargo test --locked -p muxy-client --test remote --no-run
      - name: Check that the runner can shape loopback traffic
        run: |
          sudo modprobe sch_netem || true
          sudo modprobe sch_prio || true
          sudo modprobe cls_u32 || true
          if ! sudo tc qdisc add dev lo root netem delay 1ms; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
            sudo modprobe sch_netem sch_prio cls_u32
            sudo tc qdisc add dev lo root netem delay 1ms
          fi
          sudo tc qdisc del dev lo root
      - name: The race with 127.0.0.2 delayed 120 ms each way and 127.0.0.1 untouched
        run: |
          set -euo pipefail
          scripts/route-netem.sh on
          cargo test --locked -p muxy-client --test remote netem_ -- --ignored --nocapture --test-threads=1 2>&1 | tee route.txt
          {
            echo '### Route race on loopback: 127.0.0.2 delayed 120 ms each way, 127.0.0.1 not'
            echo 'ms is the time the winning address needed to connect, run TLS and sign in; total_ms is the whole race.'
            echo '```'
            grep -ho 'route race winner=.*' route.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the shaping
        if: always()
        run: scripts/route-netem.sh off || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: route-race
          path: route.txt

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/atur-terminal' || github.ref == 'refs/heads/feat/mobile-rn' }}
      - run: cargo install cargo-ndk --locked --version 4.1.2
      - name: Build the Android libraries and the Kotlin bindings
        env:
          PLATFORMS: android
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          scripts/build-mobile-sdk.sh "$RUNNER_TEMP/atur-mobile"
          mkdir -p out && cp -r "$RUNNER_TEMP/atur-mobile/android" out/
          find out -type f | sort
      - uses: actions/upload-artifact@v4
        with:
          name: atur-mobile-android
          path: out/android

  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/atur-terminal' || github.ref == 'refs/heads/feat/mobile-rn' }}
      - name: Build the XCFramework and the Swift bindings
        env:
          PLATFORMS: ios
        run: |
          scripts/build-mobile-sdk.sh "$RUNNER_TEMP/atur-mobile"
          mkdir -p out && cp -r "$RUNNER_TEMP/atur-mobile/AturMobile.xcframework" "$RUNNER_TEMP/atur-mobile/swift" out/
          find out -maxdepth 3 | sort
      - uses: actions/upload-artifact@v4
        with:
          name: atur-mobile-ios
          path: out
