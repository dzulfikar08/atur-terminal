name: check-branding

# Scans the assets of a published release for Muxy names a user or the OS could see.
# Run it from the default branch, or push a tag check-branding-<release tag>.
on:
  push:
    tags: ['check-branding-*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example atur-v2.2.0-3
        required: true

permissions:
  contents: read

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            patterns: "*.tar.gz *.zip *.deb *.AppImage"
          - runner: macos-15
            patterns: "*.dmg"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          TAG="${TAG#check-branding-}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir artifacts \
            -p '*.tar.gz' -p '*.zip' -p '*.deb' -p '*.dmg' -p '*.AppImage'
          ls -l artifacts
      - name: Scan every asset
        run: |
          shopt -s nullglob
          failed=0
          set -f; patterns=(${{ matrix.patterns }}); set +f
          for pattern in "${patterns[@]}"; do for asset in artifacts/$pattern; do
            echo "== $asset"
            bash scripts/check-no-muxy.sh --show 12 "$asset" || failed=1
          done; done
          exit "$failed"
