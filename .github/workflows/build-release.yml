name: Build release

# Builds and verifies one Atur Terminal release for Linux x86_64 and macOS
# arm64. Called by the "Atur Terminal release" workflow, which adds the
# optional Intel Mac build after publishing.
#
# Adapted from upstream Muxy's release build. Removed: Developer ID signing,
# notarization, the Sparkle update for Muxy 1.x, arm64 Linux, the Intel Mac
# build (now a non-blocking job of the release workflow) and the mobile SDK.
# macOS bundles are ad-hoc signed, so Gatekeeper asks before the first launch
# (see README.md, "macOS").
on:
  workflow_call:
    inputs:
      version:
        description: Stamped binary version, X.Y.Z
        required: true
        type: string
      tag:
        description: Release tag, atur-vX.Y.Z or atur-vX.Y.Z-N
        required: true
        type: string
      revision:
        description: Release revision N; becomes the macOS bundle version
        required: true
        type: string
      source:
        description: Commit to build
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LIBGHOSTTY_VT_SYS_OPTIMIZE: ReleaseFast
  MACOSX_DEPLOYMENT_TARGET: '14.0'
  # Compiled into muxy-app so remote installs and in-app updates find this release.
  ATUR_RELEASE_TAG: ${{ inputs.tag }}

jobs:
  macos:
    name: Build (macOS, arm64)
    runs-on: macos-15
    timeout-minutes: 90
    env:
      VERSION: ${{ inputs.version }}
      ARCH: arm64
      PACKAGE_DIR: target/packages/${{ inputs.version }}/arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          targets: aarch64-apple-darwin
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: atur-release-aarch64-apple-darwin
      - name: Stamp the build version without committing a bump
        run: |
          rm -rf target/packages
          python3 scripts/release.py stamp "$VERSION"
      - name: Build the ad-hoc signed app, DMG and standalone client/server pair
        run: >-
          bash scripts/build-release.sh --arch "$ARCH" --version "$VERSION"
          --build-number "${{ inputs.revision }}"
      - name: Verify packaged pair, desktop bytes and standalone installation
        run: >-
          python3 scripts/verify-release-package.py
          "$PACKAGE_DIR/muxy-$VERSION-macos-$ARCH.zip"
          --version "$VERSION" --dmg "$PACKAGE_DIR/AturTerminal-$VERSION-$ARCH.dmg"
      - name: Upload distribution archives
        uses: actions/upload-artifact@v4
        with:
          name: distribution-macos-arm64
          path: |
            ${{ env.PACKAGE_DIR }}/AturTerminal-${{ env.VERSION }}-arm64.dmg
            ${{ env.PACKAGE_DIR }}/muxy-${{ env.VERSION }}-macos-arm64.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload debug symbols and dependency audits
        uses: actions/upload-artifact@v4
        with:
          name: symbols-macos-arm64
          path: |
            ${{ env.PACKAGE_DIR }}/*-symbols.zip
            ${{ env.PACKAGE_DIR }}/*-dependencies.txt
          if-no-files-found: error
          retention-days: 30
      - name: Keep packaged output out of the build cache
        if: always()
        run: rm -rf target/packages

  linux:
    name: Build (Linux CLI and server, x86_64)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      VERSION: ${{ inputs.version }}
      ARCH: x86_64
      PACKAGE_DIR: target/packages/${{ inputs.version }}/linux-x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source }}
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config binutils
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          targets: x86_64-unknown-linux-gnu
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: atur-release-x86_64-unknown-linux-gnu-glibc235
      - name: Stamp the build version without committing a bump
        run: |
          rm -rf target/packages
          python3 scripts/release.py stamp "$VERSION"
      - name: Build and package the native glibc 2.35 pair
        run: bash scripts/build-cli-linux.sh "$ARCH" "$VERSION"
      - name: Verify packaged pair and standalone installation
        run: >-
          python3 scripts/verify-release-package.py
          "$PACKAGE_DIR/muxy-$VERSION-linux-$ARCH.tar.gz"
          --version "$VERSION"
      - name: Upload distribution archives
        uses: actions/upload-artifact@v4
        with:
          name: distribution-linux-x86_64
          path: ${{ env.PACKAGE_DIR }}/muxy-${{ env.VERSION }}-linux-${{ env.ARCH }}.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Upload debug symbols and dependency audits
        uses: actions/upload-artifact@v4
        with:
          name: symbols-linux-x86_64
          path: |
            ${{ env.PACKAGE_DIR }}/*-symbols.tar.gz
            ${{ env.PACKAGE_DIR }}/*-audit.txt
          if-no-files-found: error
          retention-days: 30
      - name: Keep packaged output out of the build cache
        if: always()
        run: rm -rf target/packages

  linux-desktop:
    name: Build (Linux desktop, x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VERSION: ${{ inputs.version }}
      ARCH: x86_64
      PACKAGE_DIR: target/packages/${{ inputs.version }}/linux-desktop-x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source }}
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential pkg-config clang cmake binutils libfontconfig1-dev libfreetype-dev
          libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libvulkan-dev
          libssl-dev libwebkit2gtk-4.1-0 curl dpkg-dev file desktop-file-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          targets: x86_64-unknown-linux-gnu
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: Swatinem/rust-cache@v2
        with:
          key: atur-desktop-release-x86_64-unknown-linux-gnu
          cache-on-failure: true
      - name: Stamp and build the desktop with matching helpers
        run: |
          rm -rf target/packages
          python3 scripts/release.py stamp "$VERSION"
          bash scripts/build-desktop-release-linux.sh "$ARCH" "$VERSION"
      - name: Verify install, helpers, leases and uninstall without a display
        run: >-
          python3 scripts/verify-desktop-linux.py
          "$PACKAGE_DIR/muxy-desktop-$VERSION-linux-$ARCH.tar.gz" --version "$VERSION"
      - name: Verify APT dependencies, package lifecycle, AppImage and the user-local installer
        run: bash scripts/verify-desktop-runtime.sh "$VERSION" "$ARCH" "$PACKAGE_DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-linux-desktop-x86_64
          path: |
            ${{ env.PACKAGE_DIR }}/muxy-desktop-${{ env.VERSION }}-linux-x86_64.tar.gz
            ${{ env.PACKAGE_DIR }}/AturTerminal-${{ env.VERSION }}-linux-x86_64.AppImage
            ${{ env.PACKAGE_DIR }}/muxy-desktop*.deb
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: symbols-linux-desktop-x86_64
          path: |
            ${{ env.PACKAGE_DIR }}/*-symbols.tar.gz
            ${{ env.PACKAGE_DIR }}/*-audit.txt
          if-no-files-found: error
          retention-days: 30
      - if: always()
        run: rm -rf target/packages
