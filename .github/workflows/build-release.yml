name: Build release

# Builds and verifies one Atur Terminal release for Linux x86_64 and macOS
# arm64. Called by the "Atur Terminal release" workflow, which adds the
# optional Intel Mac build after publishing.
#
# Adapted from upstream Muxy's release build. Removed: the Sparkle update for
# Muxy 1.x, arm64 Linux, the Intel Mac build (now a non-blocking job of the
# release workflow) and the mobile SDK. macOS bundles are Developer ID signed
# and notarized when the signing secrets exist, ad-hoc signed otherwise.
on:
  workflow_call:
    inputs:
      version:
        description: Stamped binary version, X.Y.Z
        required: true
        type: string
      tag:
        description: Release tag, atur-vX.Y.Z or atur-vX.Y.Z-N
        required: true
        type: string
      revision:
        description: Release revision N; becomes the macOS bundle version
        required: true
        type: string
      source:
        description: Commit to build
        required: true
        type: string
    secrets:
      MACOS_DEVELOPER_ID_P12_BASE64:
        required: false
      MACOS_DEVELOPER_ID_P12_PASSWORD:
        required: false
      ASC_KEY_ID:
        required: false
      ASC_ISSUER_ID:
        required: false
      ASC_KEY_BASE64:
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LIBGHOSTTY_VT_SYS_OPTIMIZE: ReleaseFast
  MACOSX_DEPLOYMENT_TARGET: '14.0'
  # Compiled into atur-terminal so remote installs and in-app updates find this release.
  ATUR_RELEASE_TAG: ${{ inputs.tag }}

jobs:
  macos:
    name: Build (macOS, arm64)
    # Zig 0.15.2 cannot link against the macOS 26 SDK of macos-latest.
    runs-on: macos-15
    timeout-minutes: 90
    env:
      VERSION: ${{ inputs.version }}
      ARCH: arm64
      PACKAGE_DIR: target/packages/${{ inputs.version }}/arm64
      MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
      MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          targets: aarch64-apple-darwin
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: atur-release-aarch64-apple-darwin
      - name: Stamp the build version without committing a bump
        run: |
          rm -rf target/packages
          python3 scripts/release.py stamp "$VERSION"
      - name: Import the Developer ID certificate
        run: |
          if [[ -n "$MACOS_DEVELOPER_ID_P12_BASE64" ]]; then
            bash scripts/ci-macos-sign.sh import
          else
            echo "No Developer ID secrets: building ad-hoc signed."
          fi
      - name: Build the signed app, DMG and standalone client/server pair
        run: >-
          bash scripts/build-release.sh --arch "$ARCH" --version "$VERSION"
          --build-number "${{ inputs.revision }}"
          ${SIGN_IDENTITY:+--sign-identity "$SIGN_IDENTITY"}
      - name: Verify packaged pair, desktop bytes and standalone installation
        run: >-
          python3 scripts/verify-release-package.py
          "$PACKAGE_DIR/atur-terminal-$VERSION-macos-$ARCH.zip"
          --version "$VERSION" --dmg "$PACKAGE_DIR/AturTerminal-$VERSION-$ARCH.dmg"
      - name: Notarize, staple and verify the Gatekeeper assessment
        if: env.SIGN_IDENTITY != ''
        run: |
          bash scripts/ci-macos-sign.sh notarize \
            "$PACKAGE_DIR/AturTerminal-$VERSION-$ARCH.dmg" \
            "$PACKAGE_DIR/atur-terminal-$VERSION-macos-$ARCH.zip"
          APP="$(ls -d "$PACKAGE_DIR"/*.app)"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E 'Authority|TeamIdentifier|flags'
          spctl -a -vv -t exec "$APP"
          xcrun stapler validate "$PACKAGE_DIR/AturTerminal-$VERSION-$ARCH.dmg"
          spctl -a -vv -t open --context context:primary-signature "$PACKAGE_DIR/AturTerminal-$VERSION-$ARCH.dmg"
      - name: Remove the signing keychain
        if: always()
        run: bash scripts/ci-macos-sign.sh cleanup
      - name: Upload distribution archives
        uses: actions/upload-artifact@v4
        with:
          name: distribution-macos-arm64
          path: |
            ${{ env.PACKAGE_DIR }}/AturTerminal-${{ env.VERSION }}-arm64.dmg
            ${{ env.PACKAGE_DIR }}/atur-terminal-${{ env.VERSION }}-macos-arm64.zip
          if-no-files-found: error
          retention-days: 7
      - name: Upload debug symbols and dependency audits
        uses: actions/upload-artifact@v4
        with:
          name: symbols-macos-arm64
          path: |
            ${{ env.PACKAGE_DIR }}/*-symbols.zip
            ${{ env.PACKAGE_DIR }}/*-dependencies.txt
          if-no-files-found: error
          retention-days: 30
      - name: Keep packaged output out of the build cache
        if: always()
        run: rm -rf target/packages

  linux:
    name: Build (Linux CLI and server, x86_64)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      VERSION: ${{ inputs.version }}
      ARCH: x86_64
      PACKAGE_DIR: target/packages/${{ inputs.version }}/linux-x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source }}
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config binutils
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          targets: x86_64-unknown-linux-gnu
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: atur-release-x86_64-unknown-linux-gnu-glibc235
      - name: Stamp the build version without committing a bump
        run: |
          rm -rf target/packages
          python3 scripts/release.py stamp "$VERSION"
      - name: Build and package the native glibc 2.35 pair
        run: bash scripts/build-cli-linux.sh "$ARCH" "$VERSION"
      - name: Verify packaged pair and standalone installation
        run: >-
          python3 scripts/verify-release-package.py
          "$PACKAGE_DIR/atur-terminal-$VERSION-linux-$ARCH.tar.gz"
          --version "$VERSION"
      - name: Upload distribution archives
        uses: actions/upload-artifact@v4
        with:
          name: distribution-linux-x86_64
          path: ${{ env.PACKAGE_DIR }}/atur-terminal-${{ env.VERSION }}-linux-${{ env.ARCH }}.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Upload debug symbols and dependency audits
        uses: actions/upload-artifact@v4
        with:
          name: symbols-linux-x86_64
          path: |
            ${{ env.PACKAGE_DIR }}/*-symbols.tar.gz
            ${{ env.PACKAGE_DIR }}/*-audit.txt
          if-no-files-found: error
          retention-days: 30
      - name: Keep packaged output out of the build cache
        if: always()
        run: rm -rf target/packages

  linux-desktop:
    name: Build (Linux desktop, x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VERSION: ${{ inputs.version }}
      ARCH: x86_64
      PACKAGE_DIR: target/packages/${{ inputs.version }}/linux-desktop-x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source }}
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential pkg-config clang cmake binutils libfontconfig1-dev libfreetype-dev
          libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libvulkan-dev
          libssl-dev libwebkit2gtk-4.1-0 curl dpkg-dev file desktop-file-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          targets: x86_64-unknown-linux-gnu
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: Swatinem/rust-cache@v2
        with:
          key: atur-desktop-release-x86_64-unknown-linux-gnu
          cache-on-failure: true
      - name: Stamp and build the desktop with matching helpers
        run: |
          rm -rf target/packages
          python3 scripts/release.py stamp "$VERSION"
          bash scripts/build-desktop-release-linux.sh "$ARCH" "$VERSION"
      - name: Verify install, helpers, leases and uninstall without a display
        run: >-
          python3 scripts/verify-desktop-linux.py
          "$PACKAGE_DIR/atur-terminal-desktop-$VERSION-linux-$ARCH.tar.gz" --version "$VERSION"
      - name: Verify APT dependencies, package lifecycle, AppImage and the user-local installer
        run: bash scripts/verify-desktop-runtime.sh "$VERSION" "$ARCH" "$PACKAGE_DIR"
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-linux-desktop-x86_64
          path: |
            ${{ env.PACKAGE_DIR }}/atur-terminal-desktop-${{ env.VERSION }}-linux-x86_64.tar.gz
            ${{ env.PACKAGE_DIR }}/AturTerminal-${{ env.VERSION }}-linux-x86_64.AppImage
            ${{ env.PACKAGE_DIR }}/atur-terminal_*.deb
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: symbols-linux-desktop-x86_64
          path: |
            ${{ env.PACKAGE_DIR }}/*-symbols.tar.gz
            ${{ env.PACKAGE_DIR }}/*-audit.txt
          if-no-files-found: error
          retention-days: 30
      - if: always()
        run: rm -rf target/packages
