name: screen-lint

# Throwaway: every lint error of the screen mirroring branch in one pass.
on:
  push:
    branches: [feat/screen-mirror]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  LIBGHOSTTY_VT_SYS_OPTIMIZE: ReleaseFast

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential pkg-config clang cmake libssl-dev libfontconfig1-dev libfreetype-dev
          libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libvulkan-dev
          libwebkit2gtk-4.1-0 xvfb zsh fish binutils vim-tiny less unzip ffmpeg
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: screen-lint
      - run: cargo clippy --locked --workspace --all-targets --all-features --keep-going -- -D warnings 2>&1 | grep -v "^ *\(Compiling\|Checking\|Downloaded\|Downloading\)" | head -400
        shell: bash {0}
      - run: cargo clippy --locked --workspace --all-targets --all-features --keep-going -- -D warnings

  macos:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: screen-lint-mac
      - run: cargo clippy --locked -p atur-screen --all-targets --all-features --keep-going -- -D warnings
