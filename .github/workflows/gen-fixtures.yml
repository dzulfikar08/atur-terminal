name: gen-fixtures
on:
  push:
    branches: [gen-fixtures]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
      - run: cargo test --locked -p muxy-protocol --test fixtures -- --ignored generate_fixtures
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add crates/muxy-protocol/tests/fixtures
          git status --short
          git commit -m "Add protocol fixtures for ranged and chunked file messages" || exit 0
          git push origin HEAD:atur-terminal
