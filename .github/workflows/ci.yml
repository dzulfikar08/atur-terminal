name: ci

# Checks Atur Terminal on Linux x86_64 (headless and desktop) and macOS arm64.
# Adapted from the upstream CI: the arm64 Linux runners are dropped because
# releases do not ship them.
on:
  push:
    branches: [main, atur-terminal, feat/herdr-backend, feat/screen-mirror, phone-screen]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LIBGHOSTTY_VT_SYS_OPTIMIZE: ReleaseFast

jobs:
  macos:
    # Zig 0.15.2 cannot link against the macOS 26 SDK of macos-latest.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/protocol_fixtures.py append-only --base "$PROTOCOL_BASE"
        env:
          PROTOCOL_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/atur-terminal' }}
      - run: python3 scripts/check-desktop-macos.py
      - run: python3 scripts/protocol_fixtures.py last-release
      - run: python3 scripts/smoke-desktop-tui.py

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config zsh fish binutils vim-tiny less ffmpeg
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/atur-terminal' }}
      - run: python3 scripts/check-headless.py --target "${{ matrix.target }}"

  linux-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential pkg-config clang cmake libssl-dev libfontconfig1-dev libfreetype-dev
          libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libxcb1-dev libvulkan-dev
          libwebkit2gtk-4.1-0 xvfb
          zsh fish binutils vim-tiny less unzip ffmpeg
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/atur-terminal' }}
      - run: xvfb-run -a python3 scripts/check-desktop-linux.py --target "${{ matrix.target }}"
      - name: Install every first-party extension from the live store
        # Downloads each published package from https://extensions.diatur.com,
        # verifies its sha256 and Ed25519 signature against the baked key,
        # installs and enables it.
        run: xvfb-run -a cargo test --locked -p muxy-app marketplace_packages_install -- --ignored --nocapture
        env:
          ATUR_TERM_MARKETPLACE_URL: https://extensions.diatur.com

  # The screen mirroring check needs a Wayland compositor and the current
  # wayvnc, which Arch ships and Ubuntu's packages are too old for. The
  # binaries are built on Ubuntu 22.04, like the release, and run there:
  # the server, the desktop client's probe and the phone core's probe.
  screen-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: screen-e2e
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/atur-terminal' || github.ref == 'refs/heads/feat/screen-mirror' }}
      # The Zig wrapper builds for a baseline CPU: the binaries run on another runner.
      - run: >-
          ATUR_TERM_ZIG="$(which zig)" PATH="$PWD/scripts/zig:$PATH"
          cargo build --locked --release -p muxy-server -p muxy-cli --bins --example screen_probe --example herdr_marks_probe
      # The phone core's probe: it drives the screen through the facade the phone apps use.
      - run: >-
          ATUR_TERM_ZIG="$(which zig)" PATH="$PWD/scripts/zig:$PATH"
          cargo build --locked --release -p atur-mobile --example phone_probe
      - run: |
          mkdir bin
          cp target/release/atur-term-server target/release/examples/screen_probe target/release/examples/herdr_marks_probe target/release/examples/phone_probe bin/
      - uses: actions/upload-artifact@v4
        with:
          name: screen-e2e-bin
          path: bin
          retention-days: 3

  screen-e2e:
    needs: screen-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: archlinux:latest
      # Arch's sway carries a file capability (CAP_SYS_NICE); a container that
      # does not hold it cannot even start the program.
      options: --cap-add=SYS_NICE
    steps:
      - run: pacman -Syu --noconfirm sway swaybg wayvnc wev wl-clipboard python procps-ng git
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: screen-e2e-bin
          path: bin
      - run: chmod +x bin/*
      - run: bash scripts/screen-e2e.sh bin

  # Prompt marks of a herdr session survive a restart of the server. Runs the
  # release herdr in isolation (own socket, config and home).
  herdr-marks:
    needs: screen-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: screen-e2e-bin
          path: bin
      - run: |
          chmod +x bin/*
          gh release download v0.9.5 -R herdrdev/herdr -p herdr-linux-x86_64 -O bin/herdr
          chmod +x bin/herdr
        env:
          GH_TOKEN: ${{ github.token }}
      - run: bash scripts/herdr-marks-e2e.sh bin bin/herdr
