name: herdr-images-quick

# Compile, lint and unit tests of the server half, to iterate on the herdr
# images branch without waiting for the whole ci run. Removed before merging.
on:
  push:
    branches: [feat/herdr-images]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LIBGHOSTTY_VT_SYS_OPTIMIZE: ReleaseFast

jobs:
  server:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config zsh fish binutils vim-tiny less
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: herdr-images-quick
      - run: cargo fmt --all -- --check
      - run: >-
          ATUR_TERM_ZIG="$(which zig)" PATH="$PWD/scripts/zig:$PATH"
          cargo clippy --locked -p muxy-server -p muxy-cli --all-targets --all-features -- -D warnings
      - run: >-
          ATUR_TERM_ZIG="$(which zig)" PATH="$PWD/scripts/zig:$PATH"
          cargo test --locked -p muxy-server --all-features -- herdr backend session::owner
